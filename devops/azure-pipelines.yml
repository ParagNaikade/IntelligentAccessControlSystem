name: Intelligent Access Control – CI

trigger:
  branches:
    include:
      - develop
      - master

pr:
  branches:
    include:
      - develop
      - master

pool:
  name: SelfHosted

variables:
  tag: "$(Build.BuildId)"
  clientImage: local/intelligent-access-control-client
  apiImage: local/intelligent-access-control-api
  clientCtx: "$(Build.SourcesDirectory)/src/client"
  apiCtx: "$(Build.SourcesDirectory)/src/services/IACS.Api"

stages:
  - stage: Build
    displayName: Build Docker Images (CI Only)
    jobs:
      - job: BuildClient
        displayName: Build Client Image
        steps:
          - script: |
              $img = "$(clientImage)"
              $ctx = "$(clientCtx)"
              $df  = Join-Path $ctx "Dockerfile"

              $cache = ""
              if (docker image inspect "$img:latest" *> $null) {
                $cache = "--cache-from=$img:latest"
              }

              docker build `
                $cache `
                -t "$img:$(tag)" `
                -t "$img:latest" `
                -f "$df" `
                "$ctx"
            displayName: Build client (with local cache)

      - job: BuildAPI
        displayName: Build API Image
        steps:
          - script: |
              $img = "$(apiImage)"
              $ctx = "$(apiCtx)"
              $df  = Join-Path $ctx "Dockerfile"

              $cache = ""
              if (docker image inspect "$img:latest" *> $null) {
                $cache = "--cache-from=$img:latest"
              }

              docker build `
                $cache `
                -t "$img:$(tag)" `
                -t "$img:latest" `
                -f "$df" `
                "$ctx"
            displayName: Build API (with local cache)
